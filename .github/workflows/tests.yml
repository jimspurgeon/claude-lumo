# Runs the Python and proxy test suites on every pull request and on master (#78).
name: tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The tests build scratch repos and commit to them, so git needs an identity.
      - name: Git identity
        run: |
          git config --global user.name "claude-lumo CI"
          git config --global user.email "ci@claude-lumo.invalid"
      # On Windows runners "bash" from Python resolves to WSL's launcher; the scripts need Git Bash.
      - name: Git Bash first on PATH
        if: runner.os == 'Windows'
        run: echo 'C:\Program Files\Git\bin' >> "$GITHUB_PATH"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Python tests
        run: python -m pytest -q
      - name: Proxy tests
        run: node --test proxy/*.test.mjs
