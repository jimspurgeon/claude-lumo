# linux-install-e2e.yml: run the claude-lumo one-line install end-to-end in bare Linux
# containers and smoke-test the installed launcher. Manual trigger only.
#
# Integrity: install.sh is NEVER executed straight off a mutable remote ref. The ref
# (input, default master) is first resolved to a commit SHA in a checkout of this same
# repository; the container then fetches install.sh from that immutable SHA-pinned URL,
# sanity-checks it (non-empty, looks like claude-lumo's installer), and only then pipes
# it into bash — reproducing the one-liner's piped execution (no SRC dir, clone path).
#
# What "end-to-end" means here (no browser login exists in CI):
#   1. Piped install in a fresh container with no prerequisites (installer auto-installs).
#   2. Claimed artifacts exist: clone at ~/.claude/lumo, litellm venv, master.key,
#      claude-lumo wrapper at ~/.local/bin.
#   3. Launcher boots: `claude-lumo --version` exits 0 and proxy :8790 / litellm :4000
#      health endpoints answer (both pass without a lumo.proton.me login).

name: Linux Install E2E

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref whose install.sh to test (default: master)'
        required: false
        default: 'master'
      images:
        description: 'JSON array of Docker images (default: ["ubuntu:24.04","debian:12","fedora:latest"])'
        required: false
        default: '["ubuntu:24.04","debian:12","fedora:latest"]'
      preseed:
        description: 'Pre-seed ~/.claude/lumo at the pinned SHA ("true") or test the pure one-liner, which installs the newest release tag ("false")'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  install-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(github.event.inputs.images || '["ubuntu:24.04","debian:12","fedora:latest"]') }}

    name: ${{ matrix.image }}
    steps:
      - name: Resolve ref to pinned SHA
        run: |
          set -euo pipefail
          REF="${{ inputs.ref || 'master' }}"
          git clone --quiet --filter=blob:none --no-checkout \
            "https://github.com/${{ github.repository }}.git" /tmp/src
          # A clone only creates local refs for the default branch; fetch the ref we want
          # (works for branches, tags and raw SHAs) and pin to the commit it resolves to.
          git -C /tmp/src fetch --quiet --depth=1 origin "$REF"
          SHA="$(git -C /tmp/src rev-parse "FETCH_HEAD^{commit}")"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "SAFE_IMAGE=$(echo '${{ matrix.image }}' | tr -c 'a-zA-Z0-9.-' '-')" >> "$GITHUB_ENV"
          echo "resolved $REF -> $SHA"

      - name: Install one-liner + smoke test (single container)
        timeout-minutes: 30
        env:
          SHA: ${{ env.SHA }}
          PRESEED: ${{ inputs.preseed || 'true' }}
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.image }}"
          INSTALL_URL="https://raw.githubusercontent.com/${{ github.repository }}/$SHA/install.sh"
          LOGDIR="$(mktemp -d)"
          echo "LOGDIR=$LOGDIR" >> "$GITHUB_ENV"

          # preseed=true: seed a clone of the pinned SHA on the runner (fresh containers
          # have no git yet) and hand it to the container, so the installer exercises
          # the CLAUDE_LUMO_KEEP_CHECKOUT path (#100) and requirements.txt from the tested
          # SHA is what pip actually sees. Without this the piped installer clones and
          # checks out the newest v* tag, which on a feature branch is older than the
          # install.sh being tested (the #147 deploy-order hazard) and would mask fixes
          # to any repo file other than install.sh.
          if [ "${PRESEED}" = "true" ]; then
            git clone --quiet --filter=blob:none --no-checkout \
              "https://github.com/${{ github.repository }}.git" "$LOGDIR/seed-src"
            git -C "$LOGDIR/seed-src" fetch --quiet --depth=1 origin "$SHA"
            git -C "$LOGDIR/seed-src" checkout --quiet FETCH_HEAD
          fi

          # Inner script runs INSIDE the container; env passes the pinned URL in.
          INNER="$LOGDIR/inner.sh"
          cat > "$INNER" <<'EOS'
          set -uo pipefail
          FAIL=0
          INSTALL_URL="${INSTALL_URL:?}"
          PRESEED="${PRESEED:-true}"

          echo "=== before: what the fresh image has ==="
          for c in git node npm python python3 curl claude sudo; do
            command -v "$c" >/dev/null 2>&1 && echo "have: $c" || echo "MISSING: $c"
          done

          # preseed=true: the seeded clone (built on the runner, which has git) sits at
          # /logs/seed-src inside this container. Move it into place as ~/.claude/lumo and
          # set CLAUDE_LUMO_KEEP_CHECKOUT=1 (#100), the state after a real deploy: the
          # installer keeps that checkout, so requirements.txt from the tested SHA is
          # what pip actually sees. No git needed here; the clone comes with its .git.
          if [ "$PRESEED" = "true" ]; then
            [ -d /logs/seed-src/.git ] || { echo "FAIL: /logs/seed-src missing"; exit 1; }
            mkdir -p "$HOME/.claude"
            mv /logs/seed-src "$HOME/.claude/lumo"
            export CLAUDE_LUMO_KEEP_CHECKOUT=1
            echo "pre-seeded ~/.claude/lumo at the pinned SHA"
          fi

          echo "=== fetch install.sh (pinned SHA) ==="
          if ! command -v curl >/dev/null 2>&1; then
            echo "NOTE: image ships no curl; bootstrapping it as the package manager allows."
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update -qq && apt-get install -y -qq curl ca-certificates
            elif command -v dnf >/dev/null 2>&1; then
              dnf install -y -q curl ca-certificates
            elif command -v apk >/dev/null 2>&1; then
              apk add -q curl ca-certificates
            else
              echo "FAIL: no curl and no known package manager"; exit 1
            fi
          fi
          curl -fsSL --retry 3 "$INSTALL_URL" -o /logs/install.sh
          # Sanity checks before anything executes.
          [ -s /logs/install.sh ] || { echo "FAIL: fetched install.sh is empty"; exit 1; }
          grep -q "claude-lumo" /logs/install.sh || { echo "FAIL: fetched script is not claude-lumo's installer"; exit 1; }

          echo "=== piped install (one-liner semantics) ==="
          if ! cat /logs/install.sh | bash > /logs/install.log 2>&1; then
            echo "ONE-LINER FAILED: full log follows"
            cat /logs/install.log
            exit 1
          fi
          echo "--- install.log tail ---"
          tail -30 /logs/install.log

          echo "=== artifacts ==="
          [ -d "$HOME/.claude/lumo/.git" ] && echo "OK: clone at ~/.claude/lumo" || { echo "FAIL: no clone at ~/.claude/lumo"; FAIL=1; }
          [ -d "$HOME/.claude-lumo/litellm-venv" ] && echo "OK: litellm venv" || { echo "FAIL: no litellm venv"; FAIL=1; }
          [ -x "$HOME/.local/bin/claude-lumo" ] && echo "OK: claude-lumo wrapper" || { echo "FAIL: no claude-lumo wrapper"; FAIL=1; }
          [ -s "$HOME/.claude-lumo/master.key" ] && echo "OK: master.key" || { echo "FAIL: no master.key"; FAIL=1; }

          echo "=== launcher smoke test: claude-lumo --version ==="
          export PATH="$HOME/.local/bin:$PATH"
          timeout 120 "$HOME/.local/bin/claude-lumo" --version > /logs/version.log 2>&1
          RC=$?
          echo "exit code: $RC"
          cat /logs/version.log || true
          [ $RC -eq 0 ] || { echo "FAIL: claude-lumo --version exited $RC"; FAIL=1; }

          echo "=== health endpoints (started by the launcher run above) ==="
          curl -s --max-time 5 http://127.0.0.1:8790/v1/health && echo "" || { echo "FAIL: proxy :8790 not healthy"; FAIL=1; }
          curl -s --max-time 5 http://127.0.0.1:4000/health/liveliness && echo "" || { echo "FAIL: litellm :4000 not healthy"; FAIL=1; }

          exit $FAIL
          EOS

          docker run --rm \
            -e HOME=/root \
            -e TERM=dumb \
            -e INSTALL_URL="$INSTALL_URL" \
            -e PRESEED="${PRESEED}" \
            -v "$LOGDIR:/logs" \
            "$IMAGE" bash /logs/inner.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ env.SAFE_IMAGE }}
          path: |
            ${{ env.LOGDIR }}/install.log
            ${{ env.LOGDIR }}/version.log
          if-no-files-found: ignore
